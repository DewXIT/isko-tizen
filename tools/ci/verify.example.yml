name: Verify prototype sources
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Compile default NUI backend against API12 (not a TPK or TV execution)
        run: dotnet build src/Isko.Tv/Isko.Tv.csproj -c Release
      - name: Run platform-independent policy checks
        run: dotnet run --project tests/Isko.Protection.Tests/Isko.Protection.Tests.csproj -c Release
      - name: View ownership checks and API12 assembly audit
        run: dotnet run --project tests/Isko.Core.Tests/Isko.Core.Tests.csproj -c Release -- src/Isko.Tv/bin/Release/net6.0/Isko.Tv.dll
      - name: Fixture handlers
        run: node tools/fixture-server/test-handlers.js
      - name: Diagnostic fallback behavior
        run: node tests/diagnostics.test.js
      - name: Page input, media observation and packaging privacy
        run: |
          node tests/page-scripts.test.js
          node tests/packaging.test.cjs
          node tools/check-public-data.cjs
      - name: Generate original local video
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node tools/fixture-server/generate-media.js
      - name: Real HTTP fixture checks (not WebView tests)
        run: node tools/fixture-server/test.js
