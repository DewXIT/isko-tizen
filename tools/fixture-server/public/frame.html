<!doctype html><meta charset="utf-8"><title>Frame fixture</title><style>body{font:18px sans-serif}button,a{margin:8px}:focus{outline:4px solid orange}</style><h3>Frame navigation and request probe</h3><button id="popup">Popup</button><a id="blank" target="_blank">New window</a><a id="normal">Normal</a><button id="probe">Ad request</button><div id="isko-test-banner" data-isko-ad>FRAME BANNER</div><script>
(function(){var match=/(?:^|&)run=([a-zA-Z0-9_-]{1,48})(?:&|$)/.exec(location.search.slice(1));var run=match?match[1]:'frame';var target='/arrived?run='+run;document.getElementById('blank').href=target;document.getElementById('normal').href=target;document.getElementById('popup').onclick=function(){window.open(target,'_blank');};document.getElementById('probe').onclick=function(){var img=new Image();img.src='/ad-probe?run='+run+'&nonce='+Date.now();document.body.appendChild(img);};}());
</script>
